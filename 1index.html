<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4a90e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>매일 성경 읽기</title>
<style>
:root{--navy:#17365d;--blue:#2869c7;--sky:#edf5ff;--ink:#233247;--muted:#65748a;--line:#dce5ef;--bg:#f4f7fb;--green:#247b59}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);line-height:1.6;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;min-width:0}
input,textarea,select{font-size:16px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--blue);color:#fff}.secondary{background:#eaf1fa;color:var(--navy)}
.wrap{max-width:640px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.3;color:var(--navy);margin:10px 0 14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{font-size:17px;margin:0;color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.pill{background:var(--sky);color:var(--blue);padding:3px 10px;border-radius:999px;font-weight:800;font-size:14px}
.passage{font-size:24px;font-weight:800;color:var(--navy);margin:8px 0 2px;word-break:keep-all;line-height:1.35}
.progress{height:6px;background:#e8eef5;border-radius:99px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:var(--blue);width:0;transition:width .2s}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jump{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #ccd7e4;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:100px;resize:vertical;margin-top:10px}
.entries{display:grid;gap:8px;margin-top:10px}
.entry{border:1px solid var(--line);border-radius:10px;padding:12px;background:#ffe4cc}
.entry .verse{white-space:pre-wrap;margin:6px 0}
.small{padding:6px 12px;min-height:36px;font-size:13px}
.empty{padding:16px;text-align:center;color:var(--muted)}
.admin{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin-top:12px}
.admin>span{font-size:14px;font-weight:700;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg label{display:flex;justify-content:center;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:10px;font-weight:700;color:var(--navy);cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--navy);border-color:var(--navy)}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:4px}
.yearrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.hide{display:none!important}
.syncing{text-align:center;color:var(--green);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(23,54,93,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal-box{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.modal-box p{margin:0 0 16px;font-weight:700;color:var(--navy);font-size:17px;text-align:center}
.modal-box .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger{background:#d64545;color:#fff}
#nameModal .btns{margin-top:16px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:12px 0 0;font-size:14px;color:var(--ink);cursor:pointer}
.chk input{width:auto;margin-top:5px;flex:none}
.modal-err{color:#d64545;font-size:13px;font-weight:700;margin-top:10px;line-height:1.5}
.modal-err:empty{display:none}
.is-mobile #adminToggle,.is-mobile #adminPanel{display:none!important}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:8px}
</style></head><body><main class="wrap">
<h1>📖 매일 성경 읽기</h1>
<p class="muted" id="appStatus" role="status"></p>

<section class="panel">
 <div class="row between"><span class="row"><span class="pill" id="dayPill"></span><span class="muted" id="dayDate"></span></span><span class="muted" id="readStats"></span></div>
 <div class="passage" id="passage"></div>
 <div class="muted" id="planLabel"></div>
 <div class="progress"><div id="progressBar"></div></div>
 <div class="nav"><button class="secondary" id="prevBtn">← 이전</button><button class="primary" id="nextBtn">다음 →</button></div>
 <div class="jump"><input id="jumpDay" type="number" inputmode="numeric" min="1" max="360" placeholder="일차 입력 (1~360)" aria-label="이동할 일차"><button class="secondary" id="jumpBtn">이동</button></div>
</section>

<section class="panel" id="memoryPanel">
 <h2>기억나는 말씀</h2>
 <form id="memoryForm">
  <input id="nameInput" class="hide" maxlength="20" autocomplete="name" placeholder="이름 (처음 한 번만)" aria-label="이름" style="margin-top:10px">
  <textarea id="verseText" maxlength="3000" aria-label="말씀 입력" placeholder="오늘 마음에 남은 구절을 적어 주세요." required></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" type="submit" id="saveMemoryBtn">저장</button></div>
 </form>
</section>

<section class="panel">
 <div class="row between"><h2 id="familyTitle">가족 기록</h2><span class="muted" id="entryCount"></span></div>
 <div class="entries" id="entriesList"></div>
</section>

<section class="panel hide" id="adminPanel">
 <h2>관리자</h2>
 <div class="admin">
  <span>순서</span>
  <div class="seg">
   <label><input type="radio" name="plan" value="ot"><span>구약부터</span></label>
   <label><input type="radio" name="plan" value="nt"><span>신약부터</span></label>
  </div>
  <span>연도</span>
  <div class="yearrow"><select id="yearSelect" aria-label="통독 연도"></select><button class="primary" id="startBtn">적용</button></div>
  <span>기록</span>
  <button class="secondary" id="exportBtn">엑셀로 내려받기</button>
 </div>
</section>

<div class="row between"><span class="row"><span class="muted" id="authorLabel"></span><button class="secondary small" id="nameBtn" type="button">이름 입력</button><button class="secondary small" id="soundBtn" type="button"></button></span><button class="secondary small" id="adminToggle" type="button">관리자</button></div>
<div class="foot">JONATHAN 성경 통독표(360일 1독, 개역개정판)_V2-1</div>
</main>
<div class="modal hide" id="delModal" role="dialog" aria-modal="true" aria-labelledby="delModalMsg">
 <div class="modal-box"><p id="delModalMsg">정말 삭제할까요?</p>
  <div class="btns"><button class="secondary" id="delNo" type="button">취소</button><button class="danger" id="delYes" type="button">삭제</button></div>
 </div>
</div>
<div class="modal hide" id="nameModal" role="dialog" aria-modal="true" aria-labelledby="nameModalTitle">
 <div class="modal-box"><p id="nameModalTitle">이름 변경</p>
  <input id="nameModalInput" maxlength="20" autocomplete="off" placeholder="이름" aria-label="이름">
  <label class="chk hide" id="nameModalRenameRow"><input type="checkbox" id="nameModalRename" checked><span id="nameModalRenameText"></span></label>
  <div class="modal-err" id="nameModalError" role="alert"></div>
  <div class="btns"><button class="secondary" id="nameNo" type="button">취소</button><button class="primary" id="nameYes" type="button">저장</button></div>
 </div>
</div>

// 오늘 날짜의 일차 (1일차 = 1월 1일)
function dayLimit(){
  const now=new Date(),cy=now.getFullYear();
  if(state.year<cy)return 360;
  if(state.year>cy)return 1;
  const doy=Math.round((new Date(cy,now.getMonth(),now.getDate())-new Date(cy,0,1))/86400000)+1;
  return Math.min(Math.max(doy,1),360);
}

    ch.setUint16(12,0,true);ch.setUint16(14,33,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);

function buildXlsx(entries){

      const authors=Object.keys(first).sort((a,b)=>first[a]-first[b]||a.localeCompare(b,'ko'));
      const cell={};
      list.forEach(e=>{const k=`${e.day}|${e.author}`;cell[k]=cell[k]?cell[k]+'\n\n'+e.verseText:e.verseText;});
      const rows=[];

        authors.forEach((a,i)=>{const v=cell[`${d}|${a}`];if(v!==undefined)c+=`<c r="${colName(i+2)}${r}" s="0" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;});
        rows.push(`<row r="${r}">${c}</row>`);
      }
      const cols=`<col min="1" max="1" width="7" customWidth="1"/><col min="2" max="2" width="24" customWidth="1"/>`+(authors.length?`<col min="3" max="${2+authors.length}" width="42" customWidth="1"/>`:'');
      const xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane xSplit="2" ySplit="1" topLeftCell="C2" activePane="bottomRight" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>${cols}</cols><sheetData>${rows.join('')}</sheetData></worksheet>`;

   {name:'_rels/.rels',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
   {name:'xl/workbook.xml',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xmlEsc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
   {name:'xl/_rels/workbook.xml.rels',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},
   {name:'xl/styles.xml',text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Malgun Gothic"/></font><font><b/><sz val="11"/><name val="Malgun Gothic"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEDF5FF"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border><left style="thin"><color rgb="FFDCE5EF"/></left><right style="thin"><color rgb="FFDCE5EF"/></right><top style="thin"><color rgb="FFDCE5EF"/></top><bottom style="thin"><color rgb="FFDCE5EF"/></bottom><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="1" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="center" wrapText="1"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment horizontal="center" vertical="top"/></xf><xf numFmtId="0" fontId="0" fillId="0" borderId="1" xfId="0" applyBorder="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`},

function unlockAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;

function playChime(){
  if(!soundOn())return;
  try{if(navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}
  try{
    unlockAudio();if(!audioCtx||audioCtx.state!=='running')return;
    const t0=audioCtx.currentTime;
    [[880,0],[1175,0.16]].forEach(([f,dt])=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=f;

      g.gain.exponentialRampToValueAtTime(0.25,t0+dt+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.28);
      o.connect(g);g.connect(audioCtx.destination);
      o.start(t0+dt);o.stop(t0+dt+0.3);
    });
  }catch(e){}
}

      if(initialJumpDone){
        const known=new Set(state.entries.map(e=>e.id)),me=getAuthor();
        if(incoming.some(e=>!known.has(e.id)&&e.author!==me))playChime();
      }
      state.entries=incoming;
      const key=`${state.year}_${state.plan}`;
      if(!initialJumpDone||key!==lastKey){state.day=startDay();curLimit=dayLimit();initialJumpDone=true;}
      lastKey=key;
      render();
    },err=>{console.error(err);$('appStatus').textContent='불러오기 실패: '+err.message;render();});
  }catch(e){$('appStatus').textContent='연결 실패: '+e.message;render();}
}
start();
setInterval(checkNewDay,60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkNewDay();});
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script></body></html>
