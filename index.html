<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#4a90e2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>매일 성경 읽기</title>
<style>
:root{--navy:#17365d;--blue:#2869c7;--sky:#edf5ff;--ink:#233247;--muted:#65748a;--line:#dce5ef;--bg:#f4f7fb;--green:#247b59}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:var(--ink);line-height:1.6;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;min-width:0}
input,textarea,select{font-size:16px}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;font-weight:700;min-height:44px;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--blue);color:#fff}.secondary{background:#eaf1fa;color:var(--navy)}
.wrap{max-width:640px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
h1{font-size:30px;line-height:1.3;color:var(--navy);margin:10px 0 14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{font-size:17px;margin:0;color:var(--navy)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:13px}
.pill{background:var(--sky);color:var(--blue);padding:3px 10px;border-radius:999px;font-weight:800;font-size:14px}
.passage{font-size:24px;font-weight:800;color:var(--navy);margin:8px 0 2px;word-break:keep-all;line-height:1.35}
.progress{height:6px;background:#e8eef5;border-radius:99px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:var(--blue);width:0;transition:width .2s}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.jump{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid #ccd7e4;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:100px;resize:vertical;margin-top:10px}
.done{color:var(--green);font-weight:700}
.entries{display:grid;gap:8px;margin-top:10px}
.entry{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fcfdff}
.entry .verse{white-space:pre-wrap;margin:6px 0}
.small{padding:6px 12px;min-height:36px;font-size:13px}
.empty{padding:16px;text-align:center;color:var(--muted)}
.admin{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;margin-top:12px}
.admin>span{font-size:14px;font-weight:700;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg label{display:flex;justify-content:center;align-items:center;min-height:44px;border:1px solid var(--line);border-radius:10px;font-weight:700;color:var(--navy);cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--navy);border-color:var(--navy)}
.seg input:focus-visible+span{outline:2px solid var(--blue);outline-offset:4px}
.yearrow{display:grid;grid-template-columns:1fr auto;gap:6px}
.hide{display:none!important}
.syncing{text-align:center;color:var(--green);font-weight:700}
.foot{font-size:12px;color:var(--muted);text-align:center;padding:8px}
</style></head><body><main class="wrap">
<h1>📖 매일 성경 읽기</h1>
<p class="muted" id="appStatus" role="status"></p>

<section class="panel">
 <div class="row between"><span class="row"><span class="pill" id="dayPill"></span><span class="done" id="readStatus"></span></span><span class="muted" id="readStats"></span></div>
 <div class="passage" id="passage"></div>
 <div class="muted" id="planLabel"></div>
 <div class="progress"><div id="progressBar"></div></div>
 <div class="nav"><button class="secondary" id="prevBtn">← 이전</button><button class="primary" id="nextBtn">다음 →</button></div>
 <div class="jump"><input id="jumpDay" type="number" inputmode="numeric" min="1" max="360" placeholder="일차 입력 (1~360)" aria-label="이동할 일차"><button class="secondary" id="jumpBtn">이동</button></div>
</section>

<section class="panel" id="memoryPanel">
 <h2>기억나는 말씀</h2>
 <form id="memoryForm">
  <input id="nameInput" class="hide" maxlength="20" autocomplete="name" placeholder="이름 (처음 한 번만)" aria-label="이름" style="margin-top:10px">
  <textarea id="verseText" maxlength="3000" aria-label="말씀 입력" placeholder="오늘 마음에 남은 구절을 적어 주세요." required></textarea>
  <div class="row" style="margin-top:8px"><button class="primary" type="submit" id="saveMemoryBtn">저장</button></div>
 </form>
</section>

<section class="panel">
 <div class="row between"><h2 id="familyTitle">가족 기록</h2><span class="muted" id="entryCount"></span></div>
 <div class="entries" id="entriesList"></div>
</section>

<section class="panel hide" id="adminPanel">
 <h2>관리자</h2>
 <div class="admin">
  <span>순서</span>
  <div class="seg">
   <label><input type="radio" name="plan" value="ot"><span>구약부터</span></label>
   <label><input type="radio" name="plan" value="nt"><span>신약부터</span></label>
  </div>
  <span>연도</span>
  <div class="yearrow"><select id="yearSelect" aria-label="통독 연도"></select><button class="primary" id="startBtn">적용</button></div>
  <span>기록</span>
  <button class="secondary" id="exportBtn">엑셀로 내려받기</button>
 </div>
</section>

<div class="row between"><span class="row"><span class="muted" id="authorLabel"></span><button class="secondary small" id="nameBtn" type="button">이름 입력</button></span><button class="secondary small" id="adminToggle" type="button">관리자</button></div>
<div class="foot">통독표: JONATHAN 성경 통독표(360일 1독, 개역개정판)</div>
</main>

    art.append(top);
    if(e.id===editingId){
      const ta=document.createElement('textarea');ta.maxLength=3000;ta.value=editDraft;ta.setAttribute('aria-label','말씀 수정');
      ta.oninput=()=>{editDraft=ta.value;};
      const ok=document.createElement('button');ok.className='primary small';ok.textContent='저장';
      ok.onclick=async()=>{const t=editDraft.trim();if(!t)return;e.verseText=t;e.updatedAt=Date.now();editingId=null;render();await save();};
      const no=document.createElement('button');no.className='secondary small';no.textContent='취소';
      no.onclick=()=>{editingId=null;renderEntries();};
      const btns=document.createElement('div');btns.className='row';btns.style.marginTop='8px';btns.append(ok,no);
      art.append(ta,btns);
    }else{
      const v=document.createElement('div');v.className='verse';v.textContent=e.verseText;
      art.append(v);
      if(e.author===getAuthor()){
        const b=document.createElement('button');b.className='secondary small';b.textContent='수정';
        b.onclick=()=>{editingId=e.id;editDraft=e.verseText;renderEntries();};
        art.append(b);
      }
    }
    list.append(art);
  });
}
function initControls(){
  const ys=$('yearSelect');
  for(let y=nowYear-2;y<=nowYear+5;y++){const o=document.createElement('option');o.value=y;o.textContent=`${y}년`;ys.append(o);}
  const go=async d=>{state.day=d;render();await save();};
  $('prevBtn').onclick=()=>{if(state.day>1)go(state.day-1);};
  $('nextBtn').onclick=()=>{if(state.day<360)go(state.day+1);};
  $('jumpBtn').onclick=()=>{const d=Number($('jumpDay').value);if(!Number.isInteger(d)||d<1||d>360){alert('1~360 사이의 숫자를 입력해 주세요.');return;}$('jumpDay').value='';go(d);};
  $('jumpDay').addEventListener('keydown',e=>{if(e.key==='Enter')$('jumpBtn').click();});
  $('memoryForm').onsubmit=async e=>{
    e.preventDefault();
    const text=$('verseText').value.trim(); if(!text)return;
    let author=getAuthor();
    if(!author){author=$('nameInput').value.trim();if(!author){alert('이름을 입력해 주세요.');$('nameInput').focus();return;}localStorage.setItem('bibleReadingAuthor',author);$('nameInput').value='';getAuthor();}
    if(state.entries.some(x=>x.year===state.year&&x.plan===state.plan&&x.day===state.day&&x.author===author)){render();return;}
    state.entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),author,verseText:text,year:state.year,plan:state.plan,day:state.day,createdAt:Date.now(),updatedAt:Date.now()});
    if(await save()){$('verseText').value='';render();}
  };
  $('startBtn').onclick=async()=>{const p=document.querySelector('input[name="plan"]:checked');if(!p)return;state.year=Number($('yearSelect').value);state.plan=p.value;state.day=1;render();await save();};
  $('exportBtn').onclick=()=>{
    const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
    const rows=[['연도','순서','일차','읽을 범위','이름','기억나는 말씀','작성일']];
    state.entries.slice().sort((a,b)=>a.year-b.year||a.plan.localeCompare(b.plan)||a.day-b.day||(a.createdAt||0)-(b.createdAt||0))
      .forEach(e=>rows.push([e.year,e.plan==='ot'?'구약부터':'신약부터',e.day,PLANS[e.plan]?.[e.day-1]||'',e.author,e.verseText,new Date(e.createdAt||Date.now()).toLocaleDateString('ko-KR')]));
    const csv='﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=`성경읽기_기록_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
  };
  $('nameBtn').onclick=async()=>{
    const old=getAuthor();
    const name=(prompt(old?'새 이름을 입력해 주세요.':'이름을 입력해 주세요.',old)||'').trim();
    if(!name||name===old)return;
    const mine=state.entries.filter(e=>e.author===old);
    const taken=state.entries.some(e=>e.author===name);
    let rename=false;
    if(old&&mine.length){
      if(taken)alert(`'${name}' 이름의 기록이 이미 있어서 '${old}'의 기록은 그대로 둡니다.`);
      else rename=confirm(`'${old}' 이름으로 저장된 기록 ${mine.length}개도 '${name}'(으)로 바꿀까요?\n\n· 확인: 이름을 고칩니다.\n· 취소: 이 기기의 사용자만 바꿉니다.`);
    }
    localStorage.setItem('bibleReadingAuthor',name);
    if(rename){mine.forEach(e=>{e.author=name;e.updatedAt=Date.now();});render();await save();}
    else render();
  };
  $('adminToggle').onclick=()=>{const p=$('adminPanel');p.classList.toggle('hide');const open=!p.classList.contains('hide');$('adminToggle').textContent=open?'닫기':'관리자';if(open)p.scrollIntoView({behavior:'smooth'});};
}
function jumpToNextAfterLastRead(){
  const days=state.entries.filter(e=>e.year===state.year&&e.plan===state.plan).map(e=>e.day);
  if(!days.length)return false;
  const next=Math.min(Math.max(...days)+1,360);
  if(next===state.day)return false;
  state.day=next;
  return true;
}
let initialJumpDone=false;
function start(){
  initControls(); getAuthor();
  try{
    const c=JSON.parse(localStorage.getItem('bibleReadingCache')||'null');
    if(c&&typeof c==='object'){state={...state,...c};if(!Array.isArray(state.entries))state.entries=[];jumpToNextAfterLastRead();}
  }catch(e){}
  render();
  if(firebaseConfig.apiKey==='YOUR_API_KEY'){$('appStatus').textContent='Firebase 설정 전이라 저장되지 않습니다.';return;}
  try{
    db=getFirestore(initializeApp(firebaseConfig));
    $('appStatus').textContent='동기화 중...';$('appStatus').classList.add('syncing');
    onSnapshot(cloudDoc(),snap=>{
      applyingRemote=true;
      const s=snap.exists()&&snap.data().state;
      if(s){state={...state,...s};if(!Array.isArray(state.entries))state.entries=[];}
      applyingRemote=false;
      if(!snap.metadata.fromCache){$('appStatus').textContent='';$('appStatus').classList.remove('syncing');}
      let changed=false;
      if(!initialJumpDone&&s&&!snap.metadata.fromCache){initialJumpDone=true;changed=jumpToNextAfterLastRead();}
      render();
      if(!snap.exists()||changed)save();
    },err=>{console.error(err);$('appStatus').textContent='불러오기 실패: '+err.message;render();});
  }catch(e){$('appStatus').textContent='연결 실패: '+e.message;render();}
}
start();
</script></body></html>
